name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: file:./data/ci.db
          DATABASE_DIALECT: sqlite
          JWT_SECRET: ci-only-secret-not-for-production-0123456789
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: ci-only-password
          NEXT_PUBLIC_SITE_NAME: 易道命理
          NEXT_PUBLIC_SITE_URL: http://localhost:9111
